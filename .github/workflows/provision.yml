name: provision

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'City id (hollabrunn, sibiu, ...)'
        required: true
        default: 'hollabrunn'
      sha:
        description: 'Commit SHA to check out (default: main)'
        required: false
        default: 'main'

jobs:
  provision:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vLeapGroup/city-digital
          token: ${{ secrets.JOAI_GITHUB_TOKEN }}
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        run: |
          cd ios
          bundle install

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.FASTLANE_APPLE_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.FASTLANE_APPLE_API_KEY_ID }}.p8

      - name: Setup SSH for Match
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_PRIVATE_KEY }}" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf 'Host github.com\n  IdentityFile ~/.ssh/match_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      - name: Run Fastlane provision
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_APPLE_API_KEY_ID: ${{ secrets.FASTLANE_APPLE_API_KEY_ID }}
          FASTLANE_APPLE_API_ISSUER_ID: ${{ secrets.FASTLANE_APPLE_API_ISSUER_ID }}
          FASTLANE_APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.FASTLANE_APPLE_API_KEY_ID }}.p8
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CI: true
          CITY: ${{ inputs.city }}
        run: |
          cd ios
          npm run ios:cities
          bundle exec fastlane ios provision
