name: provision

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'City id (hollabrunn, sibiu, ...)'
        required: true
        default: 'hollabrunn'
      sha:
        description: 'Commit SHA to check out (default: main)'
        required: false
        default: 'main'

jobs:
  provision:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vLeapGroup/city-digital
          token: ${{ secrets.JOAI_GITHUB_TOKEN }}
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        run: |
          cd ios
          bundle install

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.FASTLANE_APPLE_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.FASTLANE_APPLE_API_KEY_ID }}.p8

      - name: Setup SSH for Match
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_PRIVATE_KEY }}" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf 'Host github.com\n  IdentityFile ~/.ssh/match_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      - name: Check App Groups status (diagnostic)
        env:
          FASTLANE_APPLE_API_KEY_ID: ${{ secrets.FASTLANE_APPLE_API_KEY_ID }}
          FASTLANE_APPLE_API_ISSUER_ID: ${{ secrets.FASTLANE_APPLE_API_ISSUER_ID }}
          FASTLANE_APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.FASTLANE_APPLE_API_KEY_ID }}.p8
          CITY: ${{ inputs.city }}
        run: |
          cd ios
          cat > /tmp/check_groups.rb <<'RUBY'
            require "fastlane"
            Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
              key_id: ENV["FASTLANE_APPLE_API_KEY_ID"],
              issuer_id: ENV["FASTLANE_APPLE_API_ISSUER_ID"],
              key_filepath: File.expand_path(ENV["FASTLANE_APPLE_API_KEY_PATH"]),
            )
            require "json"
            cities = JSON.parse(File.read("lib/cities.json"))
            city = cities[ENV["CITY"]] || cities["hollabrunn"]
            bid = city["nativeBundleId"]
            begin
              groups = Spaceship::ConnectAPI.provisioning_request_client.get("v1/appGroups").body
              ids = groups["data"]&.map { |g| g.dig("attributes", "identifier") }
              puts "EXISTING_APP_GROUPS: #{(ids || []).inspect}"
            rescue => ex
              puts "ERR_LIST_GROUPS: #{ex.message[0..200]}"
            end
            begin
              b = Spaceship::ConnectAPI::BundleId.find(bid, includes: "bundleIdCapabilities")
              caps = (b&.bundle_id_capabilities || []).map { |c| c.raw_data.dig("attributes", "capabilityType") }
              puts "BUNDLE_ID_CAPS for #{bid}: #{caps.inspect}"
            rescue => ex
              puts "ERR_BUNDLE_CAPS: #{ex.message[0..200]}"
            end
          RUBY
          bundle exec ruby /tmp/check_groups.rb

      - name: Run Fastlane provision
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_APPLE_API_KEY_ID: ${{ secrets.FASTLANE_APPLE_API_KEY_ID }}
          FASTLANE_APPLE_API_ISSUER_ID: ${{ secrets.FASTLANE_APPLE_API_ISSUER_ID }}
          FASTLANE_APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.FASTLANE_APPLE_API_KEY_ID }}.p8
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CI: true
          CITY: ${{ inputs.city }}
        run: |
          cd ios
          npm run ios:cities
          bundle exec fastlane ios provision
